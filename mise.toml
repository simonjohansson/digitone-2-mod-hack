[tools]
python = "3.12.13"
uv = "0.11.8"

[tasks.build-c]
description = "Build SINE and LOWPASS with DigiHealth"
run = "python build.py"

[tasks.test]
description = "Check the artifact producer and the qualification's measurements without firmware or compilers"
run = "uv run --no-project --with numpy==2.5.4 python -m unittest discover -s tests"

[tasks.qualify]
description = "Build one candidate and qualify it in the coupled emulator and on the unit"
run = "uv run --no-project --with numpy==2.5.4 --with sounddevice==0.5.6 --with mido==1.3.3 --with python-rtmidi==1.5.8 python qualify.py"
